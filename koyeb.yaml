# Koyeb service definition for the kdrama_heaven bot (reference spec; Koyeb doesn't auto-read it).
# Apply in the control panel, or run ./deploy-koyeb.sh (CLI equivalent).
app: kdrama-heaven
service:
  name: bot
  type: web                 # Free instances only allow WEB services (no workers)
  instance_type: free       # 0.1 vCPU / 512 MB; sleeps after 1 h without HTTP traffic -> ping /healthz
  regions: [fra]            # Free is Frankfurt (fra) or Washington (was) only
  scaling: {min: 1, max: 1} # one poller per token
  ports:
    - {port: 8000, protocol: http}
  routes:
    - {path: /, port: 8000}
  health_checks:
    - {type: http, port: 8000, path: /healthz}
  git:
    repository: github.com/nika-kirann/kdrama-heaven-bot
    branch: main
    builder: dockerfile
    dockerfile: Dockerfile
    deploy_on_push: true
  env:                      # "@NAME" = Koyeb secret NAME
    BOT_TOKEN: "@BOT_TOKEN"
    CHANNEL_ID: "@CHANNEL_ID"
    STORAGE_CHANNEL_ID: "@STORAGE_CHANNEL_ID"
    ADMIN_IDS: "@ADMIN_IDS"
    PORT: "8000"
    TIMEZONE: Asia/Kolkata
    STORAGE_BACKEND: telegram
    DAILY_DIGEST_TIME: "10:00"
    CLEANUP_DAYS: "2"
    CLEANUP_TIME: "03:30"
    DATABASE_URL: sqlite:////tmp/kdrama.db
    # Optional web admin password (Telegram code login always available for ADMIN_IDS):
    # ADMIN_WEB_PASSWORD: "@ADMIN_WEB_PASSWORD"
# Paid alternative (never sleeps, no pinger needed): type: worker, instance_type: eco-nano, regions: [sin]
